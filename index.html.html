<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daft Punk Pixel Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #101010;
  --panel: #1c1c1c;
  --accent: #ff006e;
  --accent2: #00ffff;
  --ink: #fff;
}

html,body {
  margin:0;
  height:100%;
  font-family:"Press Start 2P",monospace;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
}

.app {
  display:grid;
  grid-template-columns:320px 1fr;
  gap:20px;
  border:4px solid #fff;
  background:#000;
  padding:20px;
  width:960px;
  max-width:calc(100% - 40px);
}

.header {
  grid-column:1/-1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--panel);
  padding:8px;
  border:3px solid #fff;
}

.left {
  background:var(--panel);
  border:3px solid #fff;
  padding:10px;
}

h3 {font-size:10px;margin:8px 0;}

input[type="number"] {
  background:#000;
  color:#0f0;
  border:2px solid #0f0;
  font-family:inherit;
  font-size:10px;
  padding:4px;
  width:70px;
}

.btn {
  background:var(--accent);
  border:2px solid #fff;
  color:#fff;
  font-family:inherit;
  font-size:10px;
  padding:6px 10px;
  cursor:pointer;
}
.btn:disabled{opacity:0.5;cursor:default;}
.stat {
  border:2px solid #fff;
  margin-top:6px;
  padding:4px;
  background:#000;
  color:#0f0;
  font-size:10px;
}
.progress {
  margin-top:8px;
  background:#222;
  border:2px solid #fff;
  height:16px;
  overflow:hidden;
}
.progress>i {
  display:block;
  height:100%;
  background:#0f0;
  width:0%;
  transition:width .3s;
}
.log {
  font-size:8px;
  background:#111;
  color:#0ff;
  border:2px solid #fff;
  padding:6px;
  margin-top:10px;
  height:120px;
  overflow:auto;
}

/* ====== Right Panel: DAFT PUNK Logo + Starfield ====== */
.stage {
  position:relative;
  overflow:hidden;
  height:400px;
  border:3px solid #fff;
  background:#000;
}

.logo-image {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  max-width:45%;
  height:auto;
  animation:pulse 2s infinite alternate;
  image-rendering:pixelated;
}
@keyframes pulse {
  from { filter: drop-shadow(0 0 4px var(--accent2)); }
  to { filter: drop-shadow(0 0 16px var(--accent)); }
}

/* Stars */
.star {
  position:absolute;
  background:#fff;
  width:2px;
  height:2px;
  opacity:0.8;
}

/* DVD Toggle Button */
.dvd-toggle {
  position:absolute;
  bottom:10px;
  right:10px;
  font-size:8px;
  background:var(--accent2);
  border:2px solid #fff;
  color:#000;
  padding:6px 8px;
  cursor:pointer;
  font-family:inherit;
}
/* ===== Soundboard ===== */
.soundboard {
  grid-column:1/-1;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

.sound-btn {
  font-family:"Press Start 2P",monospace;
  font-size:8px;
  padding:10px;
  background:#ff006e; /* same accent as your buttons */
  border:2px solid #fff;
  color:#fff;
  cursor:pointer;
  min-width:100px;
  text-align:center;
  transition:transform 0.1s;
}

.sound-btn.active {
  background:#00ffff; /* same accent2 for "active" state */
  color:#000;
  transform:scale(1.05);
}

</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>DAFT PUNK PIXEL COUNTER</div>
    <div style="font-size:8px">HARDER • BETTER • FASTER • STRONGER</div>
  </div>

  <div class="left">
    <h3>Session</h3>
    <div>
      <label>Start</label>
      <input id="startCount" type="number" value="0" min="0">
      <label>Goal</label>
      <input id="goalCount" type="number" value="10" min="1">
    </div>

    <div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:8px;">
      <button id="startBtn" class="btn">START</button>
      <button id="pauseBtn" class="btn" disabled>PAUSE</button>
      <button id="restartBtn" class="btn" disabled>RESTART</button>
      <button id="incrementBtn" class="btn" disabled>+1</button>
      <button id="clearBtn" class="btn">CLEAR VALUES</button>
    </div>

    <div class="stat">Count: <span id="countDisplay">0</span></div>
    <div class="stat">Total: <span id="totalTime">0.00s</span></div>
    <div class="stat">Increment: <span id="incrementTime">0.00s</span></div>
    <div class="stat">Average: <span id="avgTime">0.00s</span></div>

    <div class="progress"><i id="progressFill"></i></div>
    <div style="font-size:10px;margin-top:6px;">Progress: <span id="percentDisplay">0%</span></div>

    <div class="log" id="log"></div>
  </div>

  <div class="stage" id="stage">
    <img src="daftpunk.png" alt="Daft Punk Logo" id="logo" class="logo-image">
    <button class="dvd-toggle" id="dvdToggle">DVD MODE</button>
  </div>
<!-- Soundboard -->
<div class="soundboard" id="soundboard"></div>
</div>


<script>
// ===== Starfield Effect =====
const stage=document.getElementById("stage");
const logo=document.getElementById("logo");
const stars=[];
const starCount=120;
const width=640,height=400;
for(let i=0;i<starCount;i++){
  const s=document.createElement("div");
  s.className="star";stage.appendChild(s);
  stars.push({el:s,x:Math.random()*width-width/2,y:Math.random()*height-height/2,z:Math.random()*1000+1});
}
function animateStars(){
  const centerX=width/2,centerY=height/2;
  for(const star of stars){
    star.z-=10;if(star.z<=1){star.x=Math.random()*width-width/2;star.y=Math.random()*height-height/2;star.z=1000;}
    const k=128.0/star.z;const px=star.x*k+centerX;const py=star.y*k+centerY;
    star.el.style.left=px+"px";star.el.style.top=py+"px";
    const scale=(1-star.z/1000)*3;star.el.style.width=star.el.style.height=scale+"px";
    star.el.style.opacity=1-star.z/1000;
  }
  requestAnimationFrame(animateStars);
}
animateStars();

// ===== Counter Logic =====
let startCount=0,goalCount=10,currentCount=0;
let startTime=0,lastInc=0,paused=false,times=[];
let totalTimer=null,incTimer=null;
const countDisplay=document.getElementById('countDisplay');
const totalTimeDisplay=document.getElementById('totalTime');
const incrementTimeDisplay=document.getElementById('incrementTime');
const avgTimeDisplay=document.getElementById('avgTime');
const progressFill=document.getElementById('progressFill');
const percentDisplay=document.getElementById('percentDisplay');
const log=document.getElementById('log');
const startBtn=document.getElementById('startBtn');
const pauseBtn=document.getElementById('pauseBtn');
const restartBtn=document.getElementById('restartBtn');
const incBtn=document.getElementById('incrementBtn');
const clearBtn=document.getElementById('clearBtn');
const dvdToggle=document.getElementById('dvdToggle');

// Save + Load
function saveState(){
  localStorage.setItem("daftPixelCounter",JSON.stringify({startCount,goalCount,currentCount,times}));
}
function loadState(){
  const data=localStorage.getItem("daftPixelCounter");if(!data)return;
  try{
    const s=JSON.parse(data);
    startCount=s.startCount;goalCount=s.goalCount;currentCount=s.currentCount;
    times=s.times||[];
    document.getElementById('startCount').value=startCount;
    document.getElementById('goalCount').value=goalCount;
    countDisplay.textContent=currentCount;
    updateProgress();
  }catch(e){}
}

function startSession(){
  startCount=Number(document.getElementById('startCount').value)||0;
  goalCount=Math.max(1,Number(document.getElementById('goalCount').value)||1);
  currentCount=startCount;times=[];paused=false;
  countDisplay.textContent=currentCount;startTime=Date.now();lastInc=Date.now();
  log.innerHTML="";updateProgress();
  startBtn.disabled=true;incBtn.disabled=false;pauseBtn.disabled=false;restartBtn.disabled=false;
  if(totalTimer)clearInterval(totalTimer);
  if(incTimer)clearInterval(incTimer);
  totalTimer=setInterval(()=>{if(!paused)totalTimeDisplay.textContent=((Date.now()-startTime)/1000).toFixed(2)+"s";},100);
  incTimer=setInterval(()=>{if(!paused)incrementTimeDisplay.textContent=((Date.now()-lastInc)/1000).toFixed(2)+"s";},100);
  saveState();
}
function updateProgress(){
  const percent=((currentCount-startCount)/(goalCount-startCount))*100;
  progressFill.style.width=Math.min(percent,100)+"%";
  percentDisplay.textContent=Math.min(percent,100).toFixed(0)+"%";
  const avg=times.length?(times.reduce((a,b)=>a+b,0)/times.length):0;
  avgTimeDisplay.textContent=avg.toFixed(2)+"s";
}
function increment(){
  if(paused)return;
  const now=Date.now();const delta=(now-lastInc)/1000;
  times.push(delta);lastInc=now;currentCount++;
  countDisplay.textContent=currentCount;
  const entry=document.createElement('div');
  entry.textContent=`+1 after ${delta.toFixed(2)}s`;log.prepend(entry);
  updateProgress();saveState();
  if(currentCount>=goalCount){
    clearInterval(totalTimer);clearInterval(incTimer);
    incBtn.disabled=true;pauseBtn.disabled=true;
    const msg=document.createElement('div');msg.textContent="GOAL REACHED! ★";log.prepend(msg);
  }
}
function pauseToggle(){paused=!paused;pauseBtn.textContent=paused?"RESUME":"PAUSE";saveState();}
function restartSession(){
  // only reset timers, not values
  if(totalTimer)clearInterval(totalTimer);
  if(incTimer)clearInterval(incTimer);
  paused=false;startBtn.disabled=false;incBtn.disabled=true;pauseBtn.disabled=true;restartBtn.disabled=true;
  totalTimeDisplay.textContent="0.00s";incrementTimeDisplay.textContent="0.00s";avgTimeDisplay.textContent="0.00s";log.innerHTML="";
}
function clearValues(){
  localStorage.removeItem("daftPixelCounter");
  location.reload();
}
startBtn.onclick=startSession;
incBtn.onclick=increment;
pauseBtn.onclick=pauseToggle;
restartBtn.onclick=restartSession;
clearBtn.onclick=clearValues;
loadState();

// ===== DVD Mode =====
let dvdMode=false,dx=1.8,dy=1.2,x=width/2,y=height/2;
function animateDVD(){
  if(!dvdMode)return;
  x+=dx;y+=dy;
  if(x<0||x>width-logo.width){dx*=-1;}
  if(y<0||y>height-logo.height){dy*=-1;}
  logo.style.left=x+"px";logo.style.top=y+"px";
  requestAnimationFrame(animateDVD);
}
dvdToggle.onclick=()=>{
  dvdMode=!dvdMode;
  if(dvdMode){
    dvdToggle.textContent="STOP DVD";
    logo.style.animation="none";
    logo.style.transform="translate(0,0)";
    x=width/2;y=height/2;
    animateDVD();
  }else{
    dvdToggle.textContent="DVD MODE";
    logo.style.top="50%";
    logo.style.left="50%";
    logo.style.transform="translate(-50%,-50%)";
    logo.style.animation="pulse 2s infinite alternate";
  }
};
// ===== Soundboard Logic =====
const sounds = ["atw.wav","comeon.wav","getlucky2.wav","hbfs1.wav","hbfs2.wav","humanafterall.wav","robotrock.wav"];
const soundboard = document.getElementById("soundboard");
const audioObjs = {};

sounds.forEach(s => {
  const btn = document.createElement("button");
  btn.className = "sound-btn";
  btn.textContent = s.replace(".wav","").toUpperCase();
  const audio = new Audio(s);
  audioObjs[s] = audio;

  btn.addEventListener('click', () => {
    if(!audio.paused){
      audio.pause();
      audio.currentTime = 0;
      btn.classList.remove("active");
    } else {
      audio.play();
      btn.classList.add("active");
    }
  });

  audio.onended = () => btn.classList.remove("active");
  soundboard.appendChild(btn);
});

</script>
</body>
</html>
