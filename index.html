<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daft Punk Pixel Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #101010;
  --panel: #1c1c1c;
  --accent: #ff006e;
  --accent2: #00ffff;
  --ink: #fff;
}

html,body {
  margin:0;
  height:100%;
  font-family:"Press Start 2P",monospace;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
}

.app {
  display:grid;
  grid-template-columns:320px 1fr;
  gap:20px;
  border:4px solid #fff;
  background:#000;
  padding:20px;
  width:960px;
  max-width:calc(100% - 40px);
}

.header {
  grid-column:1/-1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--panel);
  padding:8px;
  border:3px solid #fff;
}

.left {
  background:var(--panel);
  border:3px solid #fff;
  padding:10px;
}

h3 {font-size:10px;margin:8px 0;}

input[type="number"] {
  background:#000;
  color:#0f0;
  border:2px solid #0f0;
  font-family:inherit;
  font-size:10px;
  padding:4px;
  width:70px;
}

.btn {
  background:var(--accent);
  border:2px solid #fff;
  color:#fff;
  font-family:inherit;
  font-size:10px;
  padding:6px 10px;
  cursor:pointer;
}
.btn:disabled{opacity:0.5;cursor:default;}
.stat {
  border:2px solid #fff;
  margin-top:6px;
  padding:4px;
  background:#000;
  color:#0f0;
  font-size:10px;
}
.progress {
  margin-top:8px;
  background:#222;
  border:2px solid #fff;
  height:16px;
  overflow:hidden;
}
.progress>i {
  display:block;
  height:100%;
  background:#0f0;
  width:0%;
  transition:width .3s;
}
.log {
  font-size:8px;
  background:#111;
  color:#0ff;
  border:2px solid #fff;
  padding:6px;
  margin-top:10px;
  height:120px;
  overflow:auto;
}

/* ====== Right Panel: DAFT PUNK Logo + Starfield ====== */
.stage {
  position:relative;
  overflow:hidden;
  height:400px;
  border:3px solid #fff;
  background:#000;
}

.logo-image {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  max-width:45%;
  height:auto;
  animation:pulse 2s infinite alternate;
  image-rendering:pixelated;
}
@keyframes pulse {
  from { filter: drop-shadow(0 0 4px var(--accent2)); }
  to { filter: drop-shadow(0 0 16px var(--accent)); }
}

/* Stars */
.star {
  position:absolute;
  background:#fff;
  width:2px;
  height:2px;
  opacity:0.8;
}

/* DVD Toggle Button */
.dvd-toggle {
  position:absolute;
  bottom:10px;
  right:10px;
  font-size:8px;
  background:var(--accent2);
  border:2px solid #fff;
  color:#000;
  padding:6px 8px;
  cursor:pointer;
  font-family:inherit;
}

/* ===== Soundboard ===== */
.soundboard {
  grid-column:1/-1;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

.sound-btn {
  font-family:"Press Start 2P",monospace;
  font-size:8px;
  padding:10px;
  background:#ff006e;
  border:2px solid #fff;
  color:#fff;
  cursor:pointer;
  min-width:100px;
  text-align:center;
  transition:transform 0.1s;
}

.sound-btn.active {
  background:#00ffff;
  color:#000;
  transform:scale(1.05);
}

/* ===== Focus Mode Overlay ===== */
.focus-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.95);
  color: #0f0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  text-align: center;
}

.focus-overlay h1 {
  font-size: 18px;
  margin-bottom: 20px;
}

.focus-overlay .big-count {
  font-size: 36px;
  margin: 10px 0;
  color: #0f0;
}

.focus-overlay .big-progress {
  width: 80%;
  height: 20px;
  background: #222;
  border: 2px solid #fff;
  margin-top: 20px;
  position: relative;
}

.focus-overlay .big-progress-fill {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  background: #0f0;
  width: 0%;
  transition: width 0.3s;
}

.focus-btn {
  background: var(--accent);
  border: 2px solid #fff;
  color: #fff;
  font-family: inherit;
  font-size: 10px;
  padding: 6px 10px;
  cursor: pointer;
  margin-top: 20px;
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>DAFT PUNK PIXEL COUNTER</div>
    <div style="font-size:8px">HARDER • BETTER • FASTER • STRONGER</div>
  </div>

  <div class="left">
    <h3>Session</h3>
    <div>
      <label>Start</label>
      <input id="startCount" type="number" value="0" min="0">
      <label>Goal</label>
      <input id="goalCount" type="number" value="10" min="1">
    </div>

    <div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:8px;">
      <button id="startBtn" class="btn">START</button>
      <button id="pauseBtn" class="btn" disabled>PAUSE</button>
      <button id="restartBtn" class="btn" disabled>RESTART</button>
      <button id="incrementBtn" class="btn" disabled>+1</button>
      <button id="clearBtn" class="btn">CLEAR VALUES</button>
      <button id="focusBtn" class="btn" style="background:var(--accent2);color:#000;">FOCUS MODE</button>
    </div>

    <div class="stat">Count: <span id="countDisplay">0</span></div>
    <div class="stat">Total: <span id="totalTime">0.00s</span></div>
    <div class="stat">Increment: <span id="incrementTime">0.00s</span></div>
    <div class="stat">Average: <span id="avgTime">0.00s</span></div>

    <div class="progress"><i id="progressFill"></i></div>
    <div style="font-size:10px;margin-top:6px;">Progress: <span id="percentDisplay">0%</span></div>

    <div class="log" id="log"></div>
  </div>

  <div class="stage" id="stage">
    <img src="daftpunk.png" alt="Daft Punk Logo" id="logo" class="logo-image">
    <button class="dvd-toggle" id="dvdToggle">DVD MODE</button>
  </div>

  <!-- Soundboard -->
  <div class="soundboard" id="soundboard"></div>

  <!-- Music Player -->
  <div id="musicPlayerContainer" style="display:block; grid-column:1/-1; margin-top:10px; background:#111; border:3px solid #fff; padding:10px;">
    <div id="albumSelection" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
    <div id="albumPlayer" style="display:none; flex-wrap:wrap; gap:20px;">
      <div style="flex:1; min-width:300px;">
        <img id="albumCover" src="" alt="Album Cover" style="width:100%; max-width:300px; margin-bottom:10px; border:3px solid #fff; border-radius:8px;">
        <div id="playerEmbed"></div>
        <button class="btn" id="backBtn" style="margin-top:10px;">BACK TO ALBUMS</button>
      </div>
      <div style="flex:1; min-width:200px; max-height:400px; overflow:auto;" id="songList"></div>
    </div>
  </div>

  <!-- Focus Overlay -->
  <div class="focus-overlay" id="focusOverlay">
    <h1>FOCUS MODE</h1>
    <div class="big-count">Count: <span id="focusCount">0</span></div>
    <div class="big-progress"><div class="big-progress-fill" id="focusProgressFill"></div></div>
    <button class="focus-btn" id="exitFocusBtn">EXIT FOCUS</button>
  </div>
</div>

<script>
/* Starfield + Counter Logic + Music Player remain unchanged — skipping for brevity,
   only Focus Mode JS appended at bottom of your existing <script> */

const focusBtn = document.getElementById("focusBtn");
const focusOverlay = document.getElementById("focusOverlay");
const exitFocusBtn = document.getElementById("exitFocusBtn");
const focusCount = document.getElementById("focusCount");
const focusProgressFill = document.getElementById("focusProgressFill");

function updateFocusDisplay() {
  focusCount.textContent = currentCount;
  const percent = ((currentCount - startCount) / (goalCount - startCount)) * 100;
  focusProgressFill.style.width = Math.min(percent, 100) + "%";
}

focusBtn.onclick = () => {
  document.querySelector(".left").style.display = "none";
  document.querySelector("#musicPlayerContainer").style.display = "none";
  document.querySelector("#soundboard").style.display = "none";
  focusOverlay.style.display = "flex";
  updateFocusDisplay();
};

exitFocusBtn.onclick = () => {
  document.querySelector(".left").style.display = "block";
  document.querySelector("#musicPlayerContainer").style.display = "block";
  document.querySelector("#soundboard").style.display = "flex";
  focusOverlay.style.display = "none";
  updateFocusDisplay();
};

setInterval(() => {
  if (focusOverlay.style.display === "flex") updateFocusDisplay();
}, 200);
</script>
</body>
</html>
